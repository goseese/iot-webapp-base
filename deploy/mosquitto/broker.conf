# Broker, installed by deploy/install.sh as /etc/mosquitto/conf.d/<slug>.conf.
# Dynamic security is the only authentication source (no password_file, no acl_file).
# __DYNSEC_PLUGIN__ is replaced with the plugin path the installed package provides.
#
# Written for the Ubuntu 26.04 package, mosquitto 2.0.22. 2.0 has no global_plugin and no
# plugin_opt_password_init_file: with per_listener_settings at its default (false) "plugin" is
# global, and install.sh creates dynamic-security.json with `mosquitto_ctrl dynsec init` before
# the first start (2.0 does not generate one). The same lines also work on 2.1.
allow_anonymous false

plugin __DYNSEC_PLUGIN__
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# Local Node processes only.
listener 1883 127.0.0.1

# Devices, TLS. Copies of the site's Let's Encrypt certificate, refreshed by the certbot
# deploy hook (deploy/certbot-deploy-hook.sh). The broker loads them after dropping to the
# mosquitto user, so the copies are owned by mosquitto.
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
