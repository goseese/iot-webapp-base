# Voltastc web front end, installed by deploy/install.sh as /etc/nginx/sites-available/voltastc.
# __DOMAIN__ is replaced with the site name (app.voltastc.com).
# TLS ends here. The app listens on 127.0.0.1:3000 and trusts X-Forwarded-* from loopback only
# (app.js: trust proxy "loopback"), so req.ip is the client and req.secure is true.

# socket.io websocket upgrade; plain requests keep Connection: close to the app.
map $http_upgrade $voltastc_connection_upgrade
{
    default upgrade;
    ""      close;
}

server
{
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    # Let's Encrypt HTTP-01 challenges (certbot certonly --webroot, first issue and renewals).
    location /.well-known/acme-challenge/
    {
        root /var/www/letsencrypt;
    }

    location /
    {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # Protocols come from /etc/nginx/nginx.conf (TLSv1.2 TLSv1.3 on Ubuntu 26.04).
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_session_cache shared:voltastc_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Ubuntu's nginx.conf sets server_tokens build; do not advertise the version.
    server_tokens off;

    # Matches express.json({ limit: "2mb" }) in app.js and routes/api.js.
    client_max_body_size 2m;

    # Pod firmware uploads (Administration > Firmware): the file is the request body, up to 4 MB in
    # the app (services/firmware.js MAX_BYTES); the rest of the site keeps the 2 MB limit.
    location /admin/firmware/
    {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /
    {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $voltastc_connection_upgrade;
        # socket.io pings every 25 s, so an idle websocket never reaches this.
        proxy_read_timeout 120s;
    }
}
